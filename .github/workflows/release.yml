name: Release

# Builds and validates distribution artifacts (sdist + wheels), then attaches
# them to the GitHub release for version tags (v*).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build sdist and wheels
        run: python -m build
      - name: Validate metadata (twine check)
        run: twine check dist/*
      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          securebank-lab --help
          securebank-pentest --help
          securebank-research --help
          securebank-threat-model --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release with artifacts
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "SecureBank Lab $GITHUB_REF_NAME"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
