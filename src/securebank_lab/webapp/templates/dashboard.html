{% extends "base.html" %}
{% block content %}
<h1>Your accounts</h1>
<ul>
{% for acc in accounts %}
  <li>
    <a href="{{ url_for('bank.transactions', account_id=acc.id) }}">Account {{ acc.id }}</a>
    &mdash; balance {{ acc.balance_cents | money }}
  </li>
{% else %}
  <li>No accounts.</li>
{% endfor %}
</ul>
{% endblock %}
