{% extends "base.html" %}
{% block content %}
<h1>Account {{ account_id }}</h1>
<table>
  <thead><tr><th>Description</th><th>Amount</th></tr></thead>
  <tbody>
  {% for t in items %}
    <tr><td>{{ t.description }}</td><td>{{ t.amount_cents | money }}</td></tr>
  {% else %}
    <tr><td colspan="2">No transactions.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
